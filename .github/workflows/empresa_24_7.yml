name: Zona 2 Pro - Modo Francotirador eBay UE

on:
  workflow_dispatch:
  schedule:
    # Vigilancia diaria (09:00 y 16:00 hora España): pedidos, tracking y poda antes del día 30 (0€ extra)
    # Publicación semanal: solo los Domingos a las 16:00h (2h antes del pico máximo semanal de eBay)
    - cron: '0 8,15 * * *'

jobs:
  operar_empresa_ia:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo de Zona 2
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar los 7 Agentes IA
        env:
          CJ_TOKEN: ${{ secrets.CJ_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_TOKEN: ${{ secrets.EBAY_TOKEN }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python empresa_ia.py

      - name: Guardar Pack Multimedia (10 Anuncios + Reel MP4 + CSV Canva)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-multimedia-10-anuncios-reel-canva
          path: anuncios_generados/
          if-no-files-found: ignore
